<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator with History</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --panel: #ffffff;
      --text: #0b1220;
      --muted: #556077;
      --brand: #1e7ed0;
      --danger: #d64541;
      --radius: 12px;
      --shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #2d6cdf);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    main {
      width: min(520px, 100%);
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    h1 {
      margin-top: 0;
      font-size: 1.55rem;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 18px 0;
      color: var(--muted);
    }

    .row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    input[type="number"],
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(13, 26, 47, 0.15);
      border-radius: 12px;
      font-size: 1rem;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      background: var(--brand);
      color: white;
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background: rgba(30, 126, 208, 0.12);
      color: var(--text);
    }

    button.secondary:hover {
      filter: brightness(1.04);
    }

    button.danger {
      background: var(--danger);
    }

    .output {
      padding: 16px;
      border-radius: 12px;
      background: rgba(240, 246, 255, 0.8);
      border: 1px solid rgba(30, 126, 208, 0.18);
      min-height: 72px;
      line-height: 1.5;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .caption {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: -10px;
      margin-bottom: 12px;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    a {
      color: var(--brand);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Calculator + History</h1>
    <p>Enter two numbers, choose an operation, and see results tracked in history.</p>

    <div class="row">
      <label>
        <span class="caption">First number</span>
        <input id="operandA" type="number" step="any" value="0" />
      </label>
      <label>
        <span class="caption">Operation</span>
        <select id="operator">
          <option value="+">+</option>
          <option value="-">−</option>
          <option value="*">×</option>
          <option value="/">÷</option>
        </select>
      </label>
      <label>
        <span class="caption">Second number</span>
        <input id="operandB" type="number" step="any" value="0" />
      </label>
    </div>

    <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px;">
      <button id="calculateBtn">Calculate</button>
      <button id="showHistoryBtn" class="secondary">Show History</button>
      <button id="clearHistoryBtn" class="danger">Clear History</button>
    </div>

    <div class="output" id="output" aria-live="polite">
      Results and history will appear here.
    </div>

    <div class="footer">
      <p>Built for a JS summative lab. <a href="README.md" target="_blank">View docs</a>.</p>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
